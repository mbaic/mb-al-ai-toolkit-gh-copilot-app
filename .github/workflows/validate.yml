name: Validate manifests

# This repository ships no application code, so there is nothing to build or
# publish. What can break is the manifests disagreeing with each other, or an
# agent or skill declaring something Copilot will silently ignore. That is what
# this checks, on every change that can affect it.

on:
  push:
    branches: [main]
    paths:
      - '.github/plugin/**'
      - '.github/workflows/validate.yml'
      - 'plugins/**'
      - 'scripts/validate.py'
  pull_request:
    paths:
      - '.github/plugin/**'
      - '.github/workflows/validate.yml'
      - 'plugins/**'
      - 'scripts/validate.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate marketplace, plugins, agents, and skills
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # The validator is dependency-free by design, so there is no install step.
      - name: Validate
        run: python3 scripts/validate.py
